<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .account-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      padding: 2rem 0;
    }
    .account-sidebar {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 1rem;
    }
    .user-info {
      text-align: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .user-avatar {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--primary), var(--warning));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      margin: 0 auto 0.7rem;
      font-weight: 800;
    }
    .user-info h3 { font-size: 1rem; margin-bottom: 0.2rem; }
    .user-info p { font-size: 0.8rem; color: var(--text-muted); }
    .account-nav { display: flex; flex-direction: column; gap: 0.3rem; }
    .account-nav a {
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.2s;
    }
    .account-nav a:hover { background: var(--gray-light); color: var(--text); }
    .account-nav a.active { background: var(--primary); color: white; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-card);
      padding: 1.3rem;
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-card h3 { font-size: 1.8rem; color: var(--primary); }
    .stat-card p { font-size: 0.85rem; color: var(--text-muted); }

    .recent-orders {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .order-row:last-child { border-bottom: none; }
    .status-badge {
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-badge.shipped { background: #dbeafe; color: #1e40af; }
    .status-badge.delivered { background: #d1fae5; color: #065f46; }
    .status-badge.ordered { background: #fef3c7; color: #92400e; }

    @media (max-width: 800px) {
      .account-layout { grid-template-columns: 1fr; }
      .account-sidebar { position: static; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span>
      </a>
      <nav class="main-nav"><ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../shop.html">Shop</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
        <a href="../cart.html" class="cart-btn">🛒 Cart <span class="cart-count" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title mt-3">My Account</h2>
    <div class="account-layout">

      <!-- SIDEBAR -->
      <aside class="account-sidebar">
        <div class="user-info">
          <div class="user-avatar" id="avatar">U</div>
          <h3 id="userName">User</h3>
          <p id="userEmail">user@email.com</p>
        </div>
        <nav class="account-nav">
          <a href="dashboard.html" class="active">📊 Dashboard</a>
          <a href="orders.html">📦 My Orders</a>
          <a href="wishlist.html">❤️ Wishlist</a>
          <a href="addresses.html">📍 Addresses</a>
          <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main>
        <div class="stat-grid">
          <div class="stat-card">
            <h3 id="statOrders">0</h3>
            <p>Total Orders</p>
          </div>
          <div class="stat-card">
            <h3 id="statWishlist">0</h3>
            <p>Wishlist Items</p>
          </div>
          <div class="stat-card">
            <h3 id="statSpent">Rs. 0</h3>
            <p>Total Spent</p>
          </div>
        </div>

        <div class="recent-orders">
          <div class="section-head">
            <h3>Recent Orders</h3>
            <a href="orders.html" style="color:var(--primary);font-weight:600;font-size:0.9rem;">View All →</a>
          </div>
          <div id="recentOrders"></div>
        </div>
      </main>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 SportsHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/script.js"></script>

  <script>
    // Check login
    const user = Auth.current();
    if (!user) {
      window.location.href = "login.html";
    }

    // Fill user info
    document.getElementById("userName").textContent = user.name;
    document.getElementById("userEmail").textContent = user.email;
    document.getElementById("avatar").textContent = user.name.charAt(0).toUpperCase();

    // Stats
    const orders = JSON.parse(localStorage.getItem("sportshub_orders") || "[]");
    const userOrders = orders.filter(o => o.userId === user.id || true); // demo: all

    document.getElementById("statOrders").textContent = userOrders.length;
    document.getElementById("statWishlist").textContent = Wishlist.count();
    document.getElementById("statSpent").textContent = "Rs. " + userOrders.reduce((s, o) => s + o.total, 0).toLocaleString();

    // Recent orders
    const recent = document.getElementById("recentOrders");
    if (!userOrders.length) {
      recent.innerHTML = `
        <div style="text-align:center;padding:2rem;color:var(--text-muted);">
          <div style="font-size:3rem;">📦</div>
          <p>No orders yet.</p>
          <a href="../shop.html" class="btn primary-btn mt-2">Start Shopping</a>
        </div>
      `;
    } else {
      recent.innerHTML = userOrders.slice(-3).reverse().map(o => {
        const date = new Date(o.date).toLocaleDateString();
        const status = o.status || "Ordered";
        const cls = status.toLowerCase();
        return `
          <div class="order-row">
            <div>
              <strong>${o.id}</strong>
              <div style="color:var(--text-muted);font-size:0.8rem;">${date} · ${o.items.length} items</div>
            </div>
            <div style="display:flex;align-items:center;gap:0.8rem;">
              <span style="font-weight:700;">Rs. ${o.total.toLocaleString()}</span>
              <span class="status-badge ${cls}">${status}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      if (confirm("Are you sure you want to logout?")) {
        Auth.logout();
      }
    });
  </script>
</body>
</html>
