<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .auth-wrap {
      max-width: 440px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
    }
    .auth-wrap h2 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .auth-wrap .sub {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin: 0.8rem 0 1.5rem;
    }
    .auth-extra a { color: var(--primary); font-weight: 600; }
    .auth-switch {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-switch a { color: var(--primary); font-weight: 700; }
    .demo-note {
      background: rgba(59,130,246,0.08);
      border-left: 4px solid var(--primary);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span>
      </a>
      <nav class="main-nav"><ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../shop.html">Shop</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
        <a href="../cart.html" class="cart-btn">🛒 Cart <span class="cart-count" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="auth-wrap">
      <h2>Welcome Back 👋</h2>
      <p class="sub">Login to your SportsHub account</p>

      <div class="demo-note">
        💡 <strong>Demo:</strong> Email: <code>demo@sportshub.com</code> · Password: <code>demo123</code>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div class="auth-extra">
          <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn primary-btn" style="width:100%;">Login →</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 SportsHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/script.js"></script>

  <script>
    // Seed demo user if none exist
    if (!localStorage.getItem("sportshub_users")) {
      localStorage.setItem("sportshub_users", JSON.stringify([
        { id: 1, name: "Demo User", email: "demo@sportshub.com", password: "demo123" }
      ]));
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const result = Auth.login(email, password);
      if (result.success) {
        showToast("✅ Login successful! Redirecting...");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
      } else {
        showToast("❌ " + result.error);
        document.querySelector(".auth-wrap").classList.add("animate-shake");
        setTimeout(() => document.querySelector(".auth-wrap").classList.remove("animate-shake"), 500);
      }
    });
  </script>
</body>
</html>
