<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .account-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      padding: 2rem 0;
    }
    .account-sidebar {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 1rem;
    }
    .user-info {
      text-align: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .user-avatar {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, var(--primary), var(--warning));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: white;
      margin: 0 auto 0.7rem; font-weight: 800;
    }
    .user-info h3 { font-size: 1rem; }
    .user-info p { font-size: 0.8rem; color: var(--text-muted); }
    .account-nav { display: flex; flex-direction: column; gap: 0.3rem; }
    .account-nav a {
      padding: 0.7rem 0.9rem; border-radius: 10px;
      font-size: 0.9rem; font-weight: 500;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .account-nav a:hover { background: var(--gray-light); color: var(--text); }
    .account-nav a.active { background: var(--primary); color: white; }
    @media (max-width: 800px) {
      .account-layout { grid-template-columns: 1fr; }
      .account-sidebar { position: static; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span>
      </a>
      <nav class="main-nav"><ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../shop.html">Shop</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
        <a href="../cart.html" class="cart-btn">🛒 Cart <span class="cart-count" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title mt-3">My Wishlist ❤️</h2>
    <div class="account-layout">
      <aside class="account-sidebar">
        <div class="user-info">
          <div class="user-avatar" id="avatar">U</div>
          <h3 id="userName">User</h3>
          <p id="userEmail">user@email.com</p>
        </div>
        <nav class="account-nav">
          <a href="dashboard.html">📊 Dashboard</a>
          <a href="orders.html">📦 My Orders</a>
          <a href="wishlist.html" class="active">❤️ Wishlist</a>
          <a href="addresses.html">📍 Addresses</a>
          <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
      </aside>

      <main>
        <div class="product-grid" id="wishGrid"></div>
      </main>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 SportsHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/script.js"></script>

  <script>
    const user = Auth.current();
    if (!user) window.location.href = "login.html";

    document.getElementById("userName").textContent = user.name;
    document.getElementById("userEmail").textContent = user.email;
    document.getElementById("avatar").textContent = user.name.charAt(0).toUpperCase();

    function renderWishlist() {
      const ids = Wishlist.get();
      const grid = document.getElementById("wishGrid");

      if (!ids.length) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;background:var(--bg-card);border-radius:16px;box-shadow:var(--shadow);color:var(--text-muted);">
            <div style="font-size:4rem;">❤️</div>
            <h3 style="margin:1rem 0 0.4rem;color:var(--text);">Your wishlist is empty</h3>
            <p>Save your favorite products here.</p>
            <a href="../shop.html" class="btn primary-btn mt-3">Browse Products →</a>
          </div>
        `;
        return;
      }

      const items = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
      grid.innerHTML = items.map(renderProductCard).join("");
      attachGlobalProductEvents();
    }

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      if (confirm("Logout?")) Auth.logout();
    });

    renderWishlist();

    // Re-render on wishlist change
    window.addEventListener("wishlistUpdated", renderWishlist);
  </script>
</body>
</html>
