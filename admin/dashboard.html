<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 2rem;
      padding: 2rem 0;
    }
    .admin-sidebar {
      background: var(--dark);
      color: white;
      border-radius: 16px;
      padding: 1.5rem;
      height: fit-content;
      position: sticky;
      top: 1rem;
    }
    .admin-brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 1.2rem; font-weight: 800;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid #334155;
      margin-bottom: 1rem;
    }
    .admin-nav { display: flex; flex-direction: column; gap: 0.3rem; }
    .admin-nav a {
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.2s;
    }
    .admin-nav a:hover { background: rgba(255,255,255,0.08); color: white; }
    .admin-nav a.active { background: var(--primary); color: white; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .stat-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .stat-card h3 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.2rem; }
    .stat-card p { font-size: 0.85rem; color: var(--text-muted); }

    .panel {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .panel-head h3 { font-size: 1.1rem; }
    .panel-head a { color: var(--primary); font-weight: 600; font-size: 0.85rem; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.8rem 0.6rem; text-align: left; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    th { font-weight: 700; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }

    .status-badge {
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .status-badge.shipped { background: #dbeafe; color: #1e40af; }
    .status-badge.delivered { background: #d1fae5; color: #065f46; }
    .status-badge.ordered { background: #fef3c7; color: #92400e; }
    .status-badge.cancelled { background: #fee2e2; color: #991b1b; }

    @media (max-width: 800px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: static; }
      .panel { overflow-x: auto; }
      table { min-width: 600px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span>
      </a>
      <nav class="main-nav"><ul>
        <li><a href="../index.html">Store</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
        <span style="font-size:0.85rem;color:var(--text-muted);font-weight:600;">👤 Admin</span>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title mt-3">Admin Dashboard</h2>
    <div class="admin-layout">
      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span>⚙️</span> ADMIN PANEL
        </div>
        <nav class="admin-nav">
          <a href="dashboard.html" class="active">📊 Dashboard</a>
          <a href="products.html">🏷️ Products</a>
          <a href="orders.html">📦 Orders</a>
          <a href="users.html">👥 Users</a>
          <a href="../index.html">🏠 Back to Store</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main>
        <!-- Stats -->
        <div class="stat-grid" id="statsGrid"></div>

        <!-- Sales Chart -->
        <div class="panel">
          <div class="panel-head">
            <h3>📈 Sales Last 7 Days</h3>
          </div>
          <div id="salesChart"></div>
        </div>

        <!-- Recent Orders -->
        <div class="panel">
          <div class="panel-head">
            <h3>🕐 Recent Orders</h3>
            <a href="orders.html">View All →</a>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Date</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="recentOrdersTable"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 SportsHub Admin. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/admin.js"></script>

  <script>
    Admin.renderStats("statsGrid");
    Admin.renderSalesChart("salesChart");
    Admin.renderOrdersTable("recentOrdersTable", 5);
  </script>
</body>
</html>
