<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; padding: 2rem 0; }
    .cart-item-row { display: flex; gap: 1rem; align-items: center; padding: 1rem; background: var(--bg-card); border-radius: 12px; margin-bottom: 0.8rem; box-shadow: var(--shadow-sm); }
    .cart-item-row .emoji { font-size: 2.5rem; }
    .cart-summary { background: var(--bg-card); padding: 1.5rem; border-radius: 16px; box-shadow: var(--shadow); position: sticky; top: 1rem; height: fit-content; }
    .cart-summary h3 { margin-bottom: 1rem; }
    .summary-row { display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.95rem; }
    .summary-row.total { border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 1rem; font-weight: 800; font-size: 1.15rem; }
    @media (max-width: 800px) { .cart-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo"><span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span></div>
      <nav class="main-nav"><ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
        <button class="cart-btn" id="cartButton">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title mt-3">Your Cart</h2>
    <div class="cart-layout">
      <div id="cartList"></div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs. 0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="shipping">Rs. 200</span></div>
        <div class="summary-row total"><span>Total</span><span id="total">Rs. 0</span></div>
        <a href="checkout.html" class="btn primary-btn" style="width:100%;margin-top:1rem;">Proceed to Checkout →</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom"><p>&copy; 2026 SportsHub.</p></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    function renderCart() {
      const cart = Cart.get();
      const list = document.getElementById("cartList");

      if (!cart.length) {
        list.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--text-muted);">
          <div style="font-size:4rem;">🛒</div>
          <h3>Your cart is empty</h3>
          <a href="shop.html" class="btn primary-btn mt-2">Start Shopping</a>
        </div>`;
        document.getElementById("subtotal").textContent = "Rs. 0";
        document.getElementById("total").textContent = "Rs. 0";
        return;
      }

      list.innerHTML = cart.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if (!p) return "";
        return `
          <div class="cart-item-row">
            <div class="emoji">${p.emoji}</div>
            <div style="flex:1;">
              <div style="font-weight:600;">${p.title}</div>
              <div style="color:var(--text-muted);font-size:0.85rem;">Rs. ${p.price.toLocaleString()} × ${item.qty}</div>
            </div>
            <div style="display:flex;gap:0.4rem;align-items:center;">
              <button onclick="changeQty(${p.id}, -1)" style="width:32px;height:32px;border:1px solid var(--border);background:var(--bg-card);border-radius:6px;cursor:pointer;">−</button>
              <span style="min-width:24px;text-align:center;font-weight:600;">${item.qty}</span>
              <button onclick="changeQty(${p.id}, 1)" style="width:32px;height:32px;border:1px solid var(--border);background:var(--bg-card);border-radius:6px;cursor:pointer;">+</button>
            </div>
            <button onclick="removeItem(${p.id})" style="background:none;border:none;color:var(--danger);font-size:1.3rem;cursor:pointer;">🗑️</button>
          </div>
        `;
      }).join("");

      const sub = Cart.total();
      const ship = sub > 5000 ? 0 : 200;
      document.getElementById("subtotal").textContent = "Rs. " + sub.toLocaleString();
      document.getElementById("shipping").textContent = ship ? "Rs. " + ship : "FREE";
      document.getElementById("total").textContent = "Rs. " + (sub + ship).toLocaleString();
    }

    function changeQty(id, delta) {
      const cart = Cart.get();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty = Math.max(1, item.qty + delta);
      Cart.save(cart);
      renderCart();
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
