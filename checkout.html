<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · SportsHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 2rem; padding: 2rem 0; }
    .checkout-form { background: var(--bg-card); padding: 2rem; border-radius: 16px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; background: var(--bg-card); color: var(--text);
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .payment-options { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0; }
    .payment-option { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; }
    .payment-option:has(input:checked) { border-color: var(--primary); background: rgba(59,130,246,0.05); }
    @media (max-width: 800px) { .checkout-layout { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo"><span class="logo-icon">⚡</span> SPORTS<span class="logo-accent">HUB</span></div>
      <nav class="main-nav"><ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul></nav>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="dark-toggle" id="darkToggle">🌙</button>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title mt-3">Checkout</h2>
    <div class="checkout-layout">
      <form class="checkout-form" id="checkoutForm">
        <h3 style="margin-bottom:1rem;">Shipping Details</h3>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input required id="fName" placeholder="Ahmed Raza"></div>
          <div class="form-group"><label>Phone</label><input required id="fPhone" placeholder="+92 3XX XXXXXXX"></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" required id="fEmail" placeholder="you@email.com"></div>
        <div class="form-group"><label>Address</label><textarea required id="fAddress" rows="2" placeholder="House #, Street, Area"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>City</label>
            <select required id="fCity">
              <option value="">Select City</option>
              <option>Karachi</option><option>Lahore</option><option>Islamabad</option>
              <option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option><option>Peshawar</option>
            </select>
          </div>
          <div class="form-group"><label>Postal Code</label><input id="fPostal" placeholder="54000"></div>
        </div>

        <h3 style="margin:1.5rem 0 1rem;">Payment Method</h3>
        <div class="payment-options">
          <label class="payment-option"><input type="radio" name="payment" value="cod" checked> 💵 Cash on Delivery</label>
          <label class="payment-option"><input type="radio" name="payment" value="card"> 💳 Credit / Debit Card</label>
          <label class="payment-option"><input type="radio" name="payment" value="jazz"> 📱 JazzCash / EasyPaisa</label>
        </div>

        <button type="submit" class="btn primary-btn" style="width:100%;margin-top:1rem;">Place Order · <span id="orderTotal">Rs. 0</span></button>
      </form>

      <div class="checkout-form" style="height:fit-content;">
        <h3 style="margin-bottom:1rem;">Order Summary</h3>
        <div id="orderItems"></div>
        <div style="border-top:1px solid var(--border);margin-top:1rem;padding-top:1rem;">
          <div style="display:flex;justify-content:space-between;padding:0.4rem 0;"><span>Subtotal</span><span id="sumSub">Rs. 0</span></div>
          <div style="display:flex;justify-content:space-between;padding:0.4rem 0;"><span>Shipping</span><span id="sumShip">Rs. 0</span></div>
          <div style="display:flex;justify-content:space-between;padding:0.6rem 0;font-weight:800;font-size:1.1rem;border-top:1px solid var(--border);"><span>Total</span><span id="sumTotal">Rs. 0</span></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom"><p>&copy; 2026 SportsHub.</p></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    function renderSummary() {
      const cart = Cart.get();
      const items = document.getElementById("orderItems");
      if (!cart.length) {
        items.innerHTML = '<p style="color:var(--text-muted);">Cart is empty.</p>';
      } else {
        items.innerHTML = cart.map(item => {
          const p = PRODUCTS.find(x => x.id === item.id);
          if (!p) return "";
          return `<div style="display:flex;justify-content:space-between;font-size:0.9rem;padding:0.4rem 0;">
            <span>${p.emoji} ${p.title} × ${item.qty}</span>
            <span>Rs. ${(p.price * item.qty).toLocaleString()}</span>
          </div>`;
        }).join("");
      }

      const sub = Cart.total();
      const ship = sub > 5000 ? 0 : 200;
      const total = sub + ship;
      document.getElementById("sumSub").textContent = "Rs. " + sub.toLocaleString();
      document.getElementById("sumShip").textContent = ship ? "Rs. " + ship : "FREE";
      document.getElementById("sumTotal").textContent = "Rs. " + total.toLocaleString();
      document.getElementById("orderTotal").textContent = "Rs. " + total.toLocaleString();
    }

    document.getElementById("checkoutForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!Cart.get().length) { showToast("⚠️ Cart is empty"); return; }
      const orders = JSON.parse(localStorage.getItem("sportshub_orders") || "[]");
      orders.push({
        id: "SH-" + Date.now(),
        date: new Date().toISOString(),
        items: Cart.get(),
        total: Cart.total(),
        status: "Ordered"
      });
      localStorage.setItem("sportshub_orders", JSON.stringify(orders));
      Cart.clear();
      showToast("✅ Order placed successfully!");
      setTimeout(() => window.location.href = "track.html", 1500);
    });

    renderSummary();
  </script>
</body>
</html>
